{% extends "base.html" %}

{% block title %}Novo Local - GURPS Sagas{% endblock %}

{% block content %}
<div class="container">
    <h1>Novo Local</h1>
    
    <div class="card">
        <form method="POST" action="{{ url_for('novo_local') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome" class="form-label">Nome do Local *</label>
                <input type="text" id="nome" name="nome" class="form-control" required 
                       placeholder="Ex: Taverna do Dragão Dourado">
            </div>
            
            <div class="form-group">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" name="tipo" class="form-control">
                    <option value="">Selecione um tipo</option>
                    <option value="Cidade">Cidade</option>
                    <option value="Vila">Vila</option>
                    <option value="Taverna">Taverna</option>
                    <option value="Masmorra">Masmorra</option>
                    <option value="Floresta">Floresta</option>
                    <option value="Montanha">Montanha</option>
                    <option value="Deserto">Deserto</option>
                    <option value="Templo">Templo</option>
                    <option value="Castelo">Castelo</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="descricao_publica" class="form-label">Descrição Pública</label>
                <textarea id="descricao_publica" name="descricao_publica" class="form-control" rows="5"
                          placeholder="Descrição visível para todos os jogadores..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="descricao_mestre" class="form-label">Notas do Mestre</label>
                <textarea id="descricao_mestre" name="descricao_mestre" class="form-control" rows="5"
                          placeholder="Informações privadas apenas para o mestre..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="arquivo" class="form-label">Imagem do Local</label>
                <input type="file" id="arquivo" name="arquivo" class="form-control" 
                       accept="image/png,image/jpeg,image/jpg,image/gif,image/webp">
                <small style="color: var(--cor-texto-claro);">
                    Padrão: 1280 × 720 px (16:9), JPG de até 400 KB. Fora dessa proporção, a imagem é cortada no centro.
                </small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Criar Local</button>
                <a href="{{ url_for('listar_locais') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
