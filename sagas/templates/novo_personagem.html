{% extends "base.html" %}

{% block title %}Novo Personagem - GURPS Sagas{% endblock %}

{% block content %}
<div class="container">
    <h1>Novo Personagem</h1>
    
    <div class="card">
        <form method="POST">
            <div class="row">
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Nome do Personagem *</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                </div>
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Nome do Jogador</label>
                        <input type="text" name="jogador_nome" class="form-control">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Raça</label>
                        <input type="text" name="raca" class="form-control" value="Humano">
                    </div>
                </div>
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-control">
                            <option value="PJ">Personagem Jogador (PJ)</option>
                            <option value="NPC">Personagem Não-Jogador (NPC)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Pontos Base</label>
                        <input type="number" name="pontos_base" class="form-control" value="150" min="0">
                    </div>
                </div>
                <div class="col-2">
                    <div class="form-group">
                        <label class="form-label">Limite de Desvantagens</label>
                        <input type="number" name="pontos_desvantagens_max" class="form-control" value="-50" max="0">
                    </div>
                </div>
            </div>

            <h3 style="margin-top: 2rem;">Atributos Iniciais</h3>
            <div class="row">
                <div class="col-4">
                    <div class="form-group">
                        <label class="form-label">Força (ST)</label>
                        <input type="number" name="ST" class="form-control" value="10" min="1" max="20">
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <label class="form-label">Destreza (DX)</label>
                        <input type="number" name="DX" class="form-control" value="10" min="1" max="20">
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <label class="form-label">Inteligência (IQ)</label>
                        <input type="number" name="IQ" class="form-control" value="10" min="1" max="20">
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <label class="form-label">Saúde (HT)</label>
                        <input type="number" name="HT" class="form-control" value="10" min="1" max="20">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Biografia</label>
                <textarea name="biografia" class="form-control" rows="5" placeholder="História, aparência, personalidade..."></textarea>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn-primary">Criar Personagem</button>
                <a href="{{ url_for('index') }}" class="btn-secondary" style="margin-left: 1rem;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
