<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GURPS Sagas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 5rem;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1>🎲 GURPS Sagas</h1>
            <p style="color: var(--cor-texto-cinza-claro);">Criar Nova Conta</p>
        </div>
        
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem;">Registro</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" style="margin-bottom: 1.5rem;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome_completo" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-primary" style="width: 100%;">Criar Conta</button>
                </div>
            </form>
            
            <div style="margin-top: 2rem; text-align: center;">
                <p style="color: var(--cor-texto-claro);">
                    Já tem uma conta? 
                    <a href="{{ url_for('login') }}" style="color: var(--cor-primaria-azul);">Faça login aqui</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
