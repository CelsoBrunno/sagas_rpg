{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="container">
    <h1>Editar Usuário: {{ usuario.username }}</h1>
    
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" 
                       value="{{ usuario.username }}" disabled>
                <small style="color: var(--cor-texto-claro);">Username não pode ser alterado</small>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" 
                       value="{{ usuario.email or '' }}">
            </div>

            <div class="form-group">
                <label for="nome_completo" class="form-label">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" class="form-control" 
                       value="{{ usuario.nome_completo or '' }}">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="role" class="form-label">Role *</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="usuario" {% if usuario.role == 'usuario' %}selected{% endif %}>Usuário</option>
                        <option value="admin" {% if usuario.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="is_active" class="form-label">Status *</label>
                    <select id="is_active" name="is_active" class="form-control" required>
                        <option value="1" {% if usuario.is_active %}selected{% endif %}>Ativo</option>
                        <option value="0" {% if not usuario.is_active %}selected{% endif %}>Inativo</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <a href="{{ url_for('admin_usuarios_lista') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
