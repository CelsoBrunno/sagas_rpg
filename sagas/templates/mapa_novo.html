{% extends "base.html" %}

{% block title %}Novo Mapa - GURPS Sagas{% endblock %}

{% block content %}
<div class="container">
    <h1>Novo Mapa</h1>
    
    <div class="card">
        <form method="POST" action="{{ url_for('novo_mapa') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome_mapa" class="form-label">Nome do Mapa *</label>
                <input type="text" id="nome_mapa" name="nome_mapa" class="form-control" required 
                       placeholder="Ex: Mapa da Cidade de Waterdeep">
            </div>
            
            <div class="form-group">
                <label for="tipo_mapa" class="form-label">Tipo de Mapa</label>
                <select id="tipo_mapa" name="tipo_mapa" class="form-control">
                    <option value="">Selecione um tipo</option>
                    <option value="Regional">Regional</option>
                    <option value="Cidade">Cidade</option>
                    <option value="Masmorra">Masmorra</option>
                    <option value="Local">Local</option>
                    <option value="Batalha">Batalha</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="local_associado_id" class="form-label">Local Associado</label>
                <select id="local_associado_id" name="local_associado_id" class="form-control">
                    <option value="">Nenhum local (mapa regional)</option>
                    {% for local in locais %}
                        <option value="{{ local.id }}">{{ local.nome }}</option>
                    {% endfor %}
                </select>
                <small style="color: var(--cor-texto-claro);">Opcional: associe este mapa a um local específico.</small>
            </div>
            
            <div class="form-group">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea id="descricao" name="descricao" class="form-control" rows="4"
                          placeholder="Descrição do mapa..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="arquivo" class="form-label">Upload de Imagem *</label>
                <input type="file" id="arquivo" name="arquivo" class="form-control" required
                       accept="image/png,image/jpeg,image/jpg,image/gif,image/webp">
                <small style="color: var(--cor-texto-claro);">
                    Formatos aceitos: PNG, JPG, JPEG, GIF, WEBP. Tamanho máximo recomendado: 10MB.
                </small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Criar Mapa</button>
                <a href="{{ url_for('listar_mapas') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
